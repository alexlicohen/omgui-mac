<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AX OmConvert Converter</title>
<!--
    Ported from "Plugins for release/Plugins/OmConvertPlugin/AX_OMConvert.html".

    The upstream page is the same markup on top of bootstrap + jQuery + p5 (2.6 MB of assets for a
    logo, a rule and one button; every form field in it is commented out upstream). The styling is
    inlined here instead. `fillValues()` and `func()` are unchanged, so the host contract is
    identical: the page sets `window.location.hash` to `<parameters>?<output file name>` and OmGui
    turns that into the plugin's command line.
-->
<style>
  body { margin: 0; font: 13px -apple-system, "Helvetica Neue", Arial, sans-serif; color: #333;
         background: #f5f5f5; }
  #header { padding: 18px 24px 10px; }
  #logo { font-size: 22px; font-weight: 600; color: #1b6ca8; letter-spacing: 0.5px; }
  #logo small { display: block; font-size: 12px; font-weight: 400; color: #777; letter-spacing: 0; }
  #content { margin: 0 24px; padding: 18px 20px; background: #fff; border: 1px solid #ddd;
             border-radius: 4px; }
  hr { border: 0; border-top: 1px solid #e5e5e5; margin: 14px 0; }
  p { color: #555; }
  .btn { font: inherit; padding: 6px 16px; border: 1px solid #b7b7b7; border-radius: 4px;
         background: linear-gradient(#fff, #e9e9e9); cursor: pointer; }
  .btn:active { background: #e0e0e0; }
</style>

<!-- Leave this script as it is otherwise the program won't pick it up and it won't run. -->
<script language="javascript" type="text/javascript">
	var blockStart = -1;
	var blockCount = -1;

	function fillValues()
	{
		var url = document.URL;
		var urlSplit = unescape(url).split('?');

		if(urlSplit.length > 1)
		{
			var pairsString = unescape(url).split('?')[1];

			if(pairsString != "")
			{
				var pairs = pairsString.split('&');

				for (var i = 0; i < pairs.length; i++)
				{
					var keyValuePair = pairs[i].split('=');

					if(keyValuePair[0] == "startBlock")
					{
						blockStart = keyValuePair[1];
					}

					if(keyValuePair[0] == "blockCount")
					{
						blockCount = keyValuePair[1];
					}

					if(keyValuePair[0] == "input1")
					{
						var split = keyValuePair[1].split('/');
						document.getElementById("input1").textContent = split[split.length - 1];
					}
				}
			}
		}
	}

	window.onload = function() {
		fillValues();
	};

	//Return Function
	function func()
	{
		var hash = "";

		//Output File Value
		var name = "";

		var quote = "\"";

		hash = quote + name + quote + "?" + quote + name + quote;

		window.location.hash = hash;
		return 0;
	}
</script>
</head>

<body>

<div id="header">
	<span id="logo">OMConvert<small>Open Movement &mdash; AX_OMConvert</small></span>
</div>

<div id="content">

	<form name="Form1" onsubmit="return func()">

		<hr>
		<p>Converts <span id="input1">the selected file</span> into a resampled
		<code>.wav</code> alongside its SVM, wear-time and cut-point (PAEE) summaries, next to the
		source file.</p>
		<hr>
		<button type="submit" class="btn">Convert Now</button>

	</form>

</div>

</body>
</html>
